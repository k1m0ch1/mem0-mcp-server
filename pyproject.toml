[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mem0-mcp-server"
version = "0.1.0"
description = "MCP server for Mem0 memory storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x renamed FastMCP to MCPServer and dropped the low-level
    # Server.list_tools()/call_tool() decorators this module is built on, so
    # 2.x fails at import with "AttributeError: 'Server' object has no attribute
    # 'list_tools'". Upstream's migration guide sanctions pinning to keep v1
    # code running: https://py.sdk.modelcontextprotocol.io/v2/migration/
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
mem0-mcp-server = "mem0_mcp_server:run"
